# Key modules. "apps" are the frontend modules (spa-assemble-config.json) that
# make the module available; a module is detected at a site when one of its apps
# is assembled and not listed in the site's modulesToRemove.
modules:
  - {id: registration, name: "Patient registration", apps: ["@openmrs/esm-patient-registration-app"]}
  - {id: chart, name: "Patient chart & forms", apps: ["@openmrs/esm-patient-chart-app"]}
  - {id: appointments, name: "Appointments", apps: ["@openmrs/esm-appointments-app"]}
  - {id: queues, name: "Service queues", apps: ["@openmrs/esm-service-queues-app"]}
  - {id: lab, name: "Laboratory", apps: ["@openmrs/esm-laboratory-app"]}
  - {id: meds, name: "Orders & medications", apps: ["@openmrs/esm-patient-medications-app", "@openmrs/esm-patient-orders-app"]}
  - {id: dispensing, name: "Dispensing", apps: ["@openmrs/esm-dispensing-app"]}
  - {id: ward, name: "Ward & bed management", apps: ["@openmrs/esm-ward-app"]}
  - {id: mental_health, name: "Mental health dashboard", apps: ["@madiro/esm-mental-health-app"]}
  - {id: nutrition, name: "Nutrition dashboard", apps: ["@madiro/esm-nutrition-app"]}
  - {id: flags, name: "Patient flags", apps: ["@openmrs/esm-patient-flags-app"]}
  - {id: tasks, name: "Patient tasks", apps: ["@openmrs/esm-patient-task-list-app"]}
  - {id: labels, name: "ID label printing", apps: ["@openmrs/esm-patient-label-printing-app"]}
  - {id: reports, name: "Reports", apps: ["@openmrs/esm-reports-app"]}
  - {id: ocl, name: "OCL terminology", apps: ["@openmrs/esm-openconceptlab-app"]}
  - {id: billing, name: "Billing", apps: ["@openmrs/esm-billing-app"]}
  - {id: stock, name: "Stock management", apps: ["@openmrs/esm-stock-management-app"]}
